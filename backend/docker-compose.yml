# Dev stack for quicknfe. Start with: docker compose up --build
name: quicknfe

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    environment:
      DOIDO_ENV: development
      DATABASE_URL: mysql://root:password@mysql:3306/quicknfe_development
      MAILER__TYPE: smtp
      MAILER__SMTP__ADDRESS: mailpit:1025
    depends_on:
      mailpit:
        condition: service_started
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:lts
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: quicknfe_development
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  cargo-registry:
  cargo-git:
