[package]
name = "quicknfe"
description = "Starter Doido web application: Axum server, routed hello endpoint, templating scaffolding."
version = "0.1.0"
edition = "2021"
# Default binary when running `cargo run` from the app root.
# Equivalent to `cargo run --bin quicknfe` / `cargo doido`.
default-run = "quicknfe"

# Migrations live in `db/migration/mod.rs` and are compiled into this binary.
# `doido db migrate` runs the `Migrator` in-process (registered via `.migrator`
# in `src/main.rs`).

# Standalone workspace root so the app can live inside another checkout
# (e.g. `target/e2e/apps/`) without joining that parent workspace.
[workspace]

[dependencies]
doido = { version = "0.0.32-test2", default-features = false, features = ["mysql", "auth"] }
doido-auth = { version = "0.0.32-test2", features = ["mysql"] }
doido-core = { version = "0.0.32-test2" }
serde_norway = "0.9"
doido-controller = { version = "0.0.32-test2", features = ["mysql"] }
doido-model = { version = "0.0.32-test2", features = ["mysql"] }
doido-jobs = { version = "0.0.32-test2", features = ["jobs-db", "mysql"] }
doido-mailer = { version = "0.0.32-test2" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "gzip"] }
calamine = "0.26"
csv = "1.3"
flate2 = "1"
base64 = "0.22"
rmcp = { version = "2.2", features = ["server", "macros", "transport-streamable-http-server"] }
jsonwebtoken = "9"
sha2 = "0.10"
openssl = "0.10"
foreign-types = "0.3"
openssl-sys = "0.9"
oxixml-c14n = "0.1.2"
oxixml-dom = "0.1.2"
oxixml-dsig = "0.1.2"
rust_decimal = "1"
rand = "0.8"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
schemars = "0.8"
urlencoding = "2"
tower = { version = "0.5", features = ["util"] }
tokio-util = "0.7"

[dev-dependencies]
# Used by generated scaffold controller request tests (Router::oneshot).
tower = { version = "0.5", features = ["util"] }
