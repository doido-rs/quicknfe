server:
  bind: 0.0.0.0
  port: 3000
database:
  url: '{{ get_env(name="DATABASE_URL", default="mysql://root:password@localhost:3306/quicknfe_development") }}'
logger:
  # Base application log level: trace, debug, info, warn, or error.
  # Set `directives` for a full tracing EnvFilter string instead, e.g.
  # `directives: info,quicknfe=debug,sqlx=warn`. RUST_LOG overrides both.
  level: debug
  # Output renderer: compact (default) | verbose (pretty, all fields) |
  # json_response (one JSON line per response, with latency_ms).
  format: verbose
cache:
  type: memory
jobs:
  type: db
  queues: [default, catalog]
  concurrency: 5
storage:
  driver: local
  drivers:
    local:
      type: disk
      root: storage
    test:
      type: memory
mailer:
  type: smtp
  smtp:
    address: localhost:1025
auth:
  user_model: User
  modules:
    - database_authenticatable
    - registerable
    - recoverable
    - rememberable
    - validatable
  strategies:
    - cookie
  two_factor:
    enabled: false
    issuer: MyApp
  routes:
    prefix: /users
middleware:
  cors:
    enabled: true
    allow_credentials: true
    allowed_origins:
      - "http://localhost:3001"
    allowed_methods:
      - GET
      - POST
      - PATCH
      - PUT
      - DELETE
      - OPTIONS
    allowed_headers:
      - Content-Type
      - Accept
      - Authorization
mcp:
  enabled: true
  public_url: "http://localhost:3000"
settings:
  sefin:
    ambiente: 2
    # Homologação. SEFIN_BASE_URL no .env aponta ao sefin-mock quando necessário.
    base_url: '{{ get_env(name="SEFIN_BASE_URL", default="https://sefin.producaorestrita.nfse.gov.br/API/SefinNacional") }}'
  cnc:
    # CNC_BASE_URL=http://127.0.0.1:8090/cnc/consulta com sefin-mock (sem mTLS).
    base_url: '{{ get_env(name="CNC_BASE_URL", default="https://adn.producaorestrita.nfse.gov.br/cnc/consulta") }}'
  adn:
    base_url: '{{ get_env(name="ADN_BASE_URL", default="https://adn.producaorestrita.nfse.gov.br") }}'
  nfse_catalog:
    queue: catalog
    batch_size: 50
    sleep_ms: 100
    daily_hour: 3
    anexo_a_url: '{{ get_env(name="NFSE_ANEXO_A_URL", default="") }}'
    incidencia_xlsx_url: '{{ get_env(name="NFSE_INCIDENCIA_XLSX_URL", default="") }}'
    anexo_b_url: '{{ get_env(name="NFSE_ANEXO_B_URL", default="") }}'
