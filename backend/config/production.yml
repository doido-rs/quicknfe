server:
  bind: 0.0.0.0
  port: 8080
database:
  # `DATABASE_URL` at deploy time (via get_env); default is a CHANGE_ME placeholder.
  url: '{{ get_env(name="DATABASE_URL", default="mysql://root:CHANGE_ME@localhost:3306/quicknfe_production") }}'
logger:
  # Quieter logging in production. Override at deploy time with RUST_LOG.
  level: info
  # Structured access logs: one JSON line per response (status, latency_ms,
  # request_id). Override at deploy time with RUST_LOG if you need more.
  format: json_response
cache:
  type: memory
jobs:
  type: db
  queues: [default, catalog]
  concurrency: 5
storage:
  driver: local
  drivers:
    local:
      type: disk
      root: storage
    test:
      type: memory
auth:
  user_model: User
  modules:
    - database_authenticatable
    - registerable
    - recoverable
    - rememberable
    - validatable
  strategies:
    - cookie
  two_factor:
    enabled: false
    issuer: QuickNFe
  routes:
    prefix: /users
settings:
  sefin:
    ambiente: 1
    base_url: "https://sefin.nfse.gov.br/SefinNacional"
  adn:
    base_url: '{{ get_env(name="ADN_BASE_URL", default="https://adn.nfse.gov.br") }}'
    mtls_pfx_path: '{{ get_env(name="ADN_MTLS_PFX_PATH", default="./certificado.pfx") }}'
    mtls_pfx_password: '{{ get_env(name="ADN_MTLS_PFX_PASSWORD", default="") }}'
  nfse_catalog:
    queue: catalog
    batch_size: 50
    sleep_ms: 100
    daily_hour: 3
