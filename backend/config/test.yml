server:
  bind: 127.0.0.1
  port: 3001
database:
  url: '{{ get_env(name="DATABASE_URL", default="mysql://root:password@localhost:3306/quicknfe_test") }}'
logger:
  # Tests are noisy enough; only surface warnings and errors by default, and
  # send them to a file so they don't clutter test runner output.
  level: warn
  file: log/test.log
cache:
  # Tests use the in-process memory store for isolation and speed.
  type: memory
jobs:
  type: memory
storage:
  driver: test
  drivers:
    test:
      type: memory
auth:
  user_model: User
  modules:
    - database_authenticatable
    - registerable
    - recoverable
    - rememberable
    - validatable
  strategies:
    - cookie
  two_factor:
    enabled: false
    issuer: MyApp
  routes:
    prefix: /users
middleware:
  cors:
    enabled: true
    allow_credentials: true
    allowed_origins:
      - "http://localhost:3001"
    allowed_methods:
      - GET
      - POST
      - PATCH
      - PUT
      - DELETE
      - OPTIONS
    allowed_headers:
      - Content-Type
      - Accept
      - Authorization
# MCP off in test unless MCP_ENABLED=true (see mcp_oauth_test)
settings:
  sefin:
    ambiente: 2
    base_url: '{{ get_env(name="SEFIN_BASE_URL", default="https://sefin.producaorestrita.nfse.gov.br/API/SefinNacional") }}'
  cnc:
    base_url: '{{ get_env(name="CNC_BASE_URL", default="http://127.0.0.1:8090/cnc/consulta") }}'
  adn:
    base_url: '{{ get_env(name="ADN_BASE_URL", default="http://127.0.0.1:8090") }}'
  nfse_catalog:
    queue: catalog
    batch_size: 10
    sleep_ms: 0
    daily_hour: 3
