openapi: 3.0.3
info:
  title: QuickNFe API
  description: |
    REST API for QuickNFe (multi-tenant fiscal documents). Session authentication via Doido
    encrypted cookie after `POST /users/sign_in`. Tenant-scoped routes require an active
    empresa in session (`POST /tenant/empresa`).

    **Swagger UI:** [http://localhost:3000/api-docs](http://localhost:3000/api-docs)

    **MCP (optional):** Streamable HTTP at `/mcp` with OAuth 2.1 — see [docs/guides/mcp.md](../guides/mcp.md).
  version: 0.1.0
  contact:
    name: QuickNFe
servers:
  - url: http://localhost:3000
    description: Local development
  - url: http://127.0.0.1:3000
    description: Local (127.0.0.1)

tags:
  - name: Health
  - name: Auth
  - name: Tenant
  - name: Session
  - name: Empresa
  - name: Clientes
  - name: CNC
  - name: Certificados
  - name: Lotes
  - name: Documentos
  - name: Itens
  - name: Tributos
  - name: Eventos
  - name: LogsRetorno
  - name: MCP
  - name: OAuth

paths:
  /:
    get:
      tags: [Health]
      summary: Health / hello
      operationId: hello
      responses:
        '200':
          description: JSON greeting
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /users/sign_in:
    post:
      tags: [Auth]
      summary: Sign in (session cookie)
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Authenticated user
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/sign_up:
    post:
      tags: [Auth]
      summary: Register user
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '200':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'

  /users/sign_out:
    delete:
      tags: [Auth]
      summary: Sign out
      operationId: signOut
      security:
        - cookieSession: []
      responses:
        '204':
          description: Signed out

  /tenant/empresa:
    post:
      tags: [Tenant]
      summary: Select active empresa (tenant)
      operationId: switchEmpresa
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchTenantRequest'
      responses:
        '200':
          description: Tenant switched
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/me:
    get:
      tags: [Session]
      summary: Current user and tenant context
      operationId: getMe
      security:
        - cookieSession: []
      responses:
        '200':
          description: Session profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'

  /api/empresa:
    get:
      tags: [Empresa]
      summary: Active empresa
      operationId: getEmpresa
      security:
        - cookieSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaPublic'
    patch:
      tags: [Empresa]
      summary: Update active empresa
      operationId: patchEmpresa
      security:
        - cookieSession: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaForm'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaPublic'

  /api/cnc/cad:
    get:
      tags: [CNC]
      summary: Consulta cadastro CNC por inscrição federal
      operationId: consultaCncCad
      security:
        - cookieSession: []
      parameters:
        - name: inscricao_federal
          in: query
          required: true
          schema:
            type: string
          description: CPF ou CNPJ (somente dígitos)
        - name: cod_municipio
          in: query
          schema:
            type: integer
            format: int32
        - name: indicador_municipal
          in: query
          schema:
            type: string
        - name: empresa_id
          in: query
          schema:
            type: integer
            format: int64
          description: Prestador cujo certificado mTLS é usado (padrão prestador ativo)
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CncConsultaCadPublic'

  /api/clientes:
    get:
      tags: [Clientes]
      summary: List clientes
      operationId: listClientes
      security:
        - cookieSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClienteDto'
    post:
      tags: [Clientes]
      summary: Create cliente
      operationId: createCliente
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteForm'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteDto'

  /api/clientes/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Clientes]
      summary: Get cliente
      operationId: getCliente
      security:
        - cookieSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteDto'
    patch:
      tags: [Clientes]
      summary: Update cliente
      operationId: updateCliente
      security:
        - cookieSession: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteForm'
      responses:
        '200':
          content:
            application/json:
              schema:
