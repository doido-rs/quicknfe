  /mcp:
    post:
      tags: [MCP]
      summary: MCP Streamable HTTP (Bearer OAuth)
      description: Model Context Protocol endpoint when MCP_ENABLED. Requires OAuth access token.
      security:
        - bearerMcp: []
      responses:
        '401':
          description: Unauthorized — OAuth discovery via WWW-Authenticate

  /.well-known/oauth-protected-resource:
    get:
      tags: [OAuth]
      summary: OAuth protected resource metadata (RFC 9728)
      responses:
        '200':
          description: PRM JSON

  /.well-known/oauth-authorization-server:
    get:
      tags: [OAuth]
      summary: OAuth authorization server metadata (RFC 8414)
      responses:
        '200':
          description: AS metadata JSON

  /oauth/authorize:
    get:
      tags: [OAuth]
      summary: Browser authorization (login)
      responses:
        '200':
          description: HTML login form
    post:
      tags: [OAuth]
      summary: Submit login and consent
      responses:
        '302':
          description: Redirect with authorization code

  /oauth/token:
    post:
      tags: [OAuth]
      summary: Token endpoint (PKCE)
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                code:
                  type: string
                redirect_uri:
                  type: string
                client_id:
                  type: string
                code_verifier:
                  type: string
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token response

  /oauth/register:
    post:
      tags: [OAuth]
      summary: Dynamic client registration (dev)
      responses:
        '200':
          description: client_id and redirect_uris

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: _doido_session
      description: |
        Encrypted session cookie set by `POST /users/sign_in`. In Swagger UI, sign in first
        (same origin) so the browser stores the cookie, then call tenant-scoped routes.
    bearerMcp:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth access token for MCP (not used for REST /api/*).

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DocIdPath:
      name: doc_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ItemIdPath:
