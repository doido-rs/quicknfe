    delete:
      tags: [Clientes]
      summary: Delete cliente
      operationId: deleteCliente
      security:
        - cookieSession: []
      responses:
        '204':
          description: Deleted

  /api/intermediarios:
    get:
      tags: [Intermediarios]
      summary: List intermediarios
      operationId: listIntermediarios
      security:
