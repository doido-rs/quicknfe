          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntermediarioDto'
    patch:
      tags: [Intermediarios]
      summary: Update intermediario
      operationId: updateIntermediario
      security:
        - cookieSession: []
      requestBody:
        content:
          application/json:
            schema:
